<section id="works" class="works-section" style="padding: 40px 20px; max-width: 1200px; margin: 0 auto;">
    <h2 style="text-align: center; margin-bottom: 30px;">시공사례</h2>
    
    <!-- 카테고리 필터 탭 버튼 영역 -->
    <div class="portfolio-filters" style="display: flex; gap: 8px; margin-bottom: 30px; justify-content: center; flex-wrap: wrap;">
        <button type="button" class="filter-btn active" data-filter="all" style="padding: 8px 16px; border: 1px solid #333; background: #333; color: #fff; border-radius: 4px; cursor: pointer; font-weight: bold;">전체</button>
        <button type="button" class="filter-btn" data-filter="cabinet" style="padding: 8px 16px; border: 1px solid #ddd; background: #f9f9f9; color: #333; border-radius: 4px; cursor: pointer;">상부장보강</button>
        <button type="button" class="filter-btn" data-filter="grout" style="padding: 8px 16px; border: 1px solid #ddd; background: #f9f9f9; color: #333; border-radius: 4px; cursor: pointer;">케라폭시줄눈</button>
        <button type="button" class="filter-btn" data-filter="door" style="padding: 8px 16px; border: 1px solid #ddd; background: #f9f9f9; color: #333; border-radius: 4px; cursor: pointer;">문짝/도어</button>
    </div>

    <!-- 시공사례 카드 그리드 -->
    <div class="portfolio-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;">
        
        <!-- 카드 예시 1: 상부장 -->
        <div class="portfolio-card" data-category="cabinet" style="border: 1px solid #eee; border-radius: 8px; overflow: hidden; background: #fff;">
            <img src="이미지경로1.jpg" alt="상부장 보강" style="width: 100%; height: 200px; object-fit: cover;">
            <div style="padding: 15px;">
                <p style="margin: 0; font-weight: bold;">싱크대 상부장 처짐 보강 수리</p>
            </div>
        </div>

        <!-- 카드 예시 2: 줄눈 -->
        <div class="portfolio-card" data-category="grout" style="border: 1px solid #eee; border-radius: 8px; overflow: hidden; background: #fff;">
            <img src="이미지경로2.jpg" alt="줄눈 시공" style="width: 100%; height: 200px; object-fit: cover;">
            <div style="padding: 15px;">
                <p style="margin: 0; font-weight: bold;">화장실 케라폭시 줄눈 시공</p>
            </div>
        </div>

        <!-- 카드 예시 3: 도어 -->
        <div class="portfolio-card" data-category="door" style="border: 1px solid #eee; border-radius: 8px; overflow: hidden; background: #fff;">
            <img src="이미지경로3.jpg" alt="도어 수리" style="width: 100%; height: 200px; object-fit: cover;">
            <div style="padding: 15px;">
                <p style="margin: 0; font-weight: bold;">중문 슬라이딩 도어 레일 교체</p>
            </div>
        </div>

    </div>
</section>
